<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Layout thử Tổng quan v2 — dữ liệu giả, chỉ để bàn kiến trúc trang: mỗi câu hỏi nghiệp vụ một hình, chữ chỉ là nhãn.">
  <title>Layout thử · Tổng quan v2</title>
  <link rel="stylesheet" href="../../cong-no-theme.css">
  <style>
    /* Bốn câu hỏi của chủ nghiệp vụ → bốn hình; không câu kết luận, không % lặp; số nằm trong hình. */
    :root{--t0:#86b6ef;--t1:#3987e5;--t2:#efa53f;--t3:#d9622b;--t4:#a3231f;--ok:#0f766e}
    .page{max-width:1440px}
    .grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
    .card{padding:14px 18px 16px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
    .card h2{margin:0 0 10px;font-size:15px;font-weight:600;color:var(--ink-2)}
    .card h2 b{margin-left:8px;font-size:26px;color:var(--ink);letter-spacing:-.3px}
    .card h2 small{margin-left:8px;font-size:13.5px;font-weight:400;color:var(--ink-3)}
    .q{float:right;font-size:12.5px;font-weight:400;color:var(--ink-3)}

    /* 1. Bức tranh nợ: một thanh lớn, số ghi trong đoạn, nhãn nhóm thẳng hàng dưới đoạn, ngoặc "quá hạn" phía trên. */
    .age{grid-column:span 8}
    .brk{display:flex;height:22px;margin-top:6px;font-size:13.5px}
    .brk>div{display:flex;align-items:flex-end;justify-content:center;gap:6px;padding-bottom:3px;border-bottom:2px solid var(--line)}
    .brk .in{color:var(--accent-ink)}
    .brk .late{color:var(--critical);border-color:var(--critical)}
    .brk b{font-size:15px}
    .bar{display:flex;gap:3px;height:52px;margin-top:4px;border-radius:8px;overflow:hidden}
    .bar>div{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden}
    .bar>div.t0{color:#0d366b}
    .lab{display:flex;gap:3px;margin-top:6px;font-size:13px;color:var(--ink-3)}
    .lab>div{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-align:center}
    .lab b{display:block;font-weight:600;color:var(--ink-2)}
    .tiny{margin:8px 0 0;font-size:12.5px;color:var(--ink-3)}
    .tiny i{display:inline-block;width:9px;height:9px;margin-right:4px;border-radius:2px}
    .tiny b{color:var(--ink-2)}
    .topbar nav .badge{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;margin-left:8px;padding:0 7px;border-radius:11px;background:var(--critical);color:#fff;font-size:12.5px;font-weight:700}

    /* 2. Thu tháng này: một thước đo đã thu / phát sinh, có vạch "hôm nay" trong tháng. */
    .month{grid-column:span 4}
    .meter{position:relative;height:30px;margin:24px 0 6px;border-radius:6px;background:#e6eaf0;overflow:visible}
    .meter .fill{height:100%;border-radius:6px;background:var(--ok)}
    .meter .today{position:absolute;top:-20px;bottom:-6px;border-left:2px dashed var(--ink-2)}
    .meter .today span{position:absolute;top:0;right:6px;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
    .mrow{display:flex;justify-content:space-between;font-size:13.5px;color:var(--ink-3)}
    .mrow b{display:block;font-size:20px;color:var(--ink)}
    .mrow .got b{color:var(--ok)}
    .note{margin:14px 0 0;font-size:12.5px;color:var(--ink-3)}

    /* 3. Ai cần đòi trước: bảng, hình là cột cơ cấu nợ trên CÙNG thang; lý do là hai cột số ngày tô theo ngưỡng. */
    .who{grid-column:span 8}
    table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
    th{padding:0 8px 6px;font-size:13px;font-weight:500;color:var(--ink-3);text-align:right;border-bottom:1px solid var(--line)}
    th:first-child,td:first-child{text-align:left}
    th.l{text-align:left}
    td{padding:0 8px;height:40px;border-bottom:1px solid var(--line-soft);text-align:right;font-size:15px}
    td.nm{font-weight:600;white-space:nowrap}
    td.nm i{display:inline-block;width:10px;height:10px;margin-right:8px;border-radius:50%;vertical-align:0}
    .r-high i{background:var(--critical)} .r-watch i{background:var(--t2)} .r-ok i{background:var(--t1)}
    td.od{font-weight:700;color:var(--critical)}
    td.dim{color:var(--ink-3)}
    .st{display:flex;gap:1px;height:12px;border-radius:6px;overflow:hidden}
    .st i{display:block;height:100%}
    td.days{font-size:14px}
    td.days.bad{color:var(--critical);font-weight:700}
    td.days.warn{color:var(--warning);font-weight:600}
    .foot{display:flex;justify-content:space-between;margin-top:8px;font-size:13px;color:var(--ink-3)}
    .foot a{color:var(--accent-ink)}
    .lg{display:inline-flex;gap:12px}
    .lg i{display:inline-block;width:10px;height:10px;margin-right:4px;border-radius:2px;vertical-align:-1px}

    /* 4. Rủi ro phân bố ở đâu: ma trận 2×2 đúng hai yếu tố của quy tắc (trả gần nhất × đi hàng gần nhất); bấm ô = lọc bảng. */
    .risk{grid-column:span 4;align-self:start}
    .mx{display:grid;grid-template-columns:84px 1fr 1fr;grid-template-rows:auto auto auto;gap:6px}
    .mx .h{display:flex;align-items:flex-end;justify-content:center;padding-bottom:2px;font-size:12.5px;color:var(--ink-3);text-align:center}
    .mx .v{display:flex;align-items:center;font-size:12.5px;color:var(--ink-3);line-height:1.3}
    .mx .c{display:flex;flex-direction:column;justify-content:center;min-height:86px;padding:8px 12px;border-radius:8px;cursor:pointer;border:1px solid transparent}
    .mx .c:hover{border-color:var(--accent)}
    .mx .c b{font-size:22px;line-height:1.1}
    .mx .c span{font-size:13px;color:var(--ink-2)}
    .mx .c.h0{background:#eaf2fc} .mx .c.h1{background:#fdf3e1} .mx .c.h2{background:#fbe1cf} .mx .c.h3{background:#f6cfcc}
    .mx .c.h3 b{color:var(--critical)}
  </style>
</head>
<body>
  <div id="demo-banner" role="status">Layout thử v2 · DỮ LIỆU GIẢ · để bàn kiến trúc trang, chưa phải thiết kế duyệt</div>
  <header class="topbar">
    <a class="brand" href="#">Công nợ HTH</a>
    <nav aria-label="Điều hướng chính"><a class="active" href="#" aria-current="page">Tổng quan</a><a href="#">Công nợ theo tháng</a><a href="#">Sổ khách</a><a href="#">Việc cần làm<span class="badge">5</span></a></nav>
    <label class="search"><span aria-hidden="true">⌕</span><input type="search" aria-label="Tìm khách" placeholder="Tìm khách để mở sổ"></label>
    <time class="asof">Số liệu đến 30/10/2026</time>
  </header>
  <main class="page">
    <div class="page-head"><h1>Tổng quan công nợ</h1><div class="live-controls"><time>Cập nhật 08:54 · tự tải mỗi 60 giây</time><button class="btn" type="button">Làm mới</button></div></div>
    <div class="grid" id="g"></div>
  </main>
  <script>
    // Dữ liệu giả hoàn toàn (tên và số bịa, số tròn), chỉ để xem bố cục.
    const tiers = [9, 24, 26, 5, 2.5];
    const total = tiers.reduce((s, v) => s + v, 0);
    const late = tiers[2] + tiers[3] + tiers[4];
    const names = ['Khách A', 'Khách B', 'Khách C', 'Khách D', 'Khách E', 'Khách F', 'Khách G', 'Khách H'];
    const rows = [
      { n: 0, t: [3, 11, 11, 0, 0], pay: 90, trip: 2, r: 'high' },
      { n: 1, t: [0, 2.5, 4, 0, 0], pay: 40, trip: 12, r: 'watch' },
      { n: 2, t: [0, 0, 0, 3, 0], pay: 200, trip: 160, r: 'high' },
      { n: 3, t: [0, 0, 2.5, 0, 0], pay: 45, trip: 9, r: 'watch' },
      { n: 4, t: [0, 0.8, 0.9, 0.9, 0], pay: 150, trip: 4, r: 'high' },
      { n: 5, t: [2, 7, 1, 0, 0], pay: 95, trip: 1, r: 'high' },
      { n: 6, t: [0, 0, 0.3, 0.4, 0.2], pay: null, trip: 130, r: 'high' },
      { n: 7, t: [0.4, 1.2, 0.8, 0, 0], pay: 20, trip: 3, r: 'watch' },
    ];
    const f = v => v.toLocaleString('vi-VN', { maximumFractionDigits: 2 });
    const pct = v => `${Math.round(v / total * 100)}%`;
    const maxRow = Math.max(...rows.map(r => r.t.reduce((s, v) => s + v, 0)));
    const labs = ['Chưa đến hạn', 'Đến hạn 31/10', '1–2 tháng', '3–6 tháng', 'Trên 6 tháng'];
    const spans = ['nợ T10', 'nợ T9', 'nợ T7–T8', 'nợ T3–T6', 'nợ T2 về trước'];
    const seg = (cls, arr) => arr.map((v, i) => `<div class="t${i}" style="flex:${v}">${cls ? `${f(v)} tỷ` : ''}</div>`).join('');
    const days = (d, bad, warn) => d == null ? `<td class="days bad">chưa trả</td>` : `<td class="days${d > bad ? ' bad' : d > warn ? ' warn' : ''}">${d}</td>`;
    document.getElementById('g').innerHTML = `
      <section class="card age"><h2>Còn phải thu <b>${f(total)} tỷ</b><small>60 khách đang nợ</small><span class="q">hạn trả: cuối tháng sau ⓘ</span></h2>
        <div class="brk"><div class="in" style="flex:${tiers[0] + tiers[1]}">Trong hạn <b>${f(tiers[0] + tiers[1])} tỷ</b></div><div class="late" style="flex:${late}">Quá hạn <b>${f(late)} tỷ</b> · ${pct(late)} · 45 khách</div></div>
        <div class="bar">${tiers.map((v, i) => `<div class="t${i}" style="flex:${v};background:var(--t${i})">${v / total > 0.07 ? `${f(v)} tỷ` : ''}</div>`).join('')}</div>
        <div class="lab">${tiers.map((v, i) => `<div style="flex:${v}">${v / total > 0.07 ? `<b>${labs[i]}</b>${spans[i]}` : ''}</div>`).join('')}</div>
        <p class="tiny">Đoạn hẹp: ${tiers.map((v, i) => v / total <= 0.07 ? `<i style="background:var(--t${i})"></i>${labs[i].toLowerCase()} <b>${f(v)} tỷ</b> (${spans[i]})` : '').filter(Boolean).join(' · ')}</p>
      </section>
      <section class="card month"><h2>Thu tháng 10<span class="q">đã thu / phát sinh</span></h2>
        <div class="meter"><div class="fill" style="width:4%"></div><div class="today" style="left:${Math.round(30 / 31 * 100)}%"><span>hôm nay 30/10</span></div></div>
        <div class="mrow"><div class="got"><b>360 triệu</b>đã thu · 4%</div><div style="text-align:right"><b>9 tỷ</b>phát sinh tháng này</div></div>
        <p class="note">Chưa tính 20 chuyến thiếu đơn giá · 3 khách đang dư 200 triệu</p>
      </section>
      <section class="card who"><h2>Khách cần đòi trước<span class="q">xếp theo quá hạn · tỷ đồng · ngày</span></h2>
        <table><thead><tr><th class="l">Khách</th><th class="l" style="width:260px">Cơ cấu nợ (cùng thang)</th><th>Quá hạn</th><th>Còn nợ</th><th>Chưa trả</th><th>Đi hàng</th></tr></thead><tbody>
        ${rows.map(r => { const sum = r.t.reduce((s, v) => s + v, 0); const od = r.t[2] + r.t[3] + r.t[4]; return `<tr>
          <td class="nm r-${r.r}"><i></i>${names[r.n]}</td>
          <td><div class="st" style="width:${Math.round(sum / maxRow * 100)}%">${r.t.map((v, i) => v ? `<i style="flex:${v};background:var(--t${i})"></i>` : '').join('')}</div></td>
          <td class="od">${f(od)}</td><td class="dim">${f(sum)}</td>${days(r.pay, 60, 30)}${days(r.trip, 90, 30)}</tr>`; }).join('')}
        </tbody></table>
        <div class="foot"><span class="lg"><span><i style="background:var(--critical)"></i>Rủi ro cao</span><span><i style="background:var(--t2)"></i>Theo dõi</span><span>Ngày đỏ: chưa trả &gt;60 · không đi hàng &gt;90</span></span><a href="#">Xem cả 45 khách ở Công nợ theo tháng ›</a></div>
      </section>
      <section class="card risk"><h2>Khách quá hạn đang ở đâu<span class="q">bấm ô để lọc bảng</span></h2>
        <div class="mx">
          <div></div><div class="h">Có trả trong 60 ngày</div><div class="h">Trên 60 ngày chưa trả</div>
          <div class="v">Còn đi hàng</div><div class="c h0"><b>6 khách</b><span>quá hạn 3 tỷ</span></div><div class="c h2"><b>18 khách</b><span>quá hạn 15 tỷ</span></div>
          <div class="v">Ngừng đi hàng<br>&gt;90 ngày</div><div class="c h1"><b>5 khách</b><span>quá hạn 2 tỷ</span></div><div class="c h3"><b>16 khách</b><span>quá hạn 13,5 tỷ</span></div>
        </div>
      </section>`;
  </script>
</body>
</html>
