<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Nhật ký công việc: việc đã đưa lên hệ thống, đọc từ các thay đổi đã merge trên GitHub, tự cập nhật. Chỉ xem.">
  <title>Công nợ HTH · Nhật ký công việc</title>
  <link rel="stylesheet" href="cong-no-theme.css">
  <link rel="stylesheet" href="app-nav.css">
  <link rel="stylesheet" href="nhat-ky-cong-viec.css">
</head>
<body class="nk-page">
  <div id="demo-banner" hidden role="status"></div>
  <aside class="app-nav" data-active="nhat-ky"></aside>
  <main class="page app-page">
    <div class="page-head topbar">
      <h1>Nhật ký công việc</h1>
      <div class="live-controls nk"><span class="live" id="live"><i></i><span id="liveTxt">Đang tải…</span></span></div>
    </div>
    <div id="error" role="alert" hidden></div>
    <div class="nk">
      <div class="profile">
        <aside class="pside">
          <div class="pid">
            <div class="avatar" id="avatar"></div>
            <div><h1 class="pname">Nhật ký công việc</h1><div class="plogin">cong-no-doi-xe</div></div>
          </div>
          <p class="pbio">Việc đã đưa lên hệ thống công nợ khách và đội xe, tự cập nhật từ GitHub mỗi 5 phút.</p>
          <ul class="pmeta" id="pmeta"></ul>
          <section class="psec"><h2>Thành tích</h2><div class="achv" id="achv"></div></section>
          <section class="psec"><h2>Đang làm tiếp</h2><div class="nextlist" id="next"></div></section>
        </aside>

        <div class="pmain">
          <nav class="tabs" id="tabs" aria-label="Các phần"></nav>
          <div class="fbar" id="fbar" hidden aria-live="polite"></div>

          <div id="view-tong-quan" class="view">
            <section class="Box" id="today">
              <div class="Box-h"><h3 id="todayHead"></h3><span id="todayLink"></span></div>
              <div class="stats" id="todayStats"></div>
              <div class="tline" id="tline"></div>
              <div style="padding:0 16px 10px"><div class="Progress" id="todayBar"></div></div>
              <div class="legend" id="todayLegend"></div>
            </section>

            <section><h2 class="h2"><b>Việc lớn</b></h2><div class="pins" id="pins"></div></section>

            <section>
              <h2 class="h2" id="contribTitle"></h2>
              <div class="contrib">
                <div class="Box"><div class="Box-b scroll"><table class="cg" id="cg"></table>
                  <div class="cfoot"><span>Bấm một ô để lọc ngày đó</span><span class="scale">Ít <i class="sq"></i><i class="sq l1"></i><i class="sq l2"></i><i class="sq l3"></i><i class="sq l4"></i> Nhiều</span></div></div></div>
                <nav class="yearlist" id="seg" aria-label="Chọn tháng"></nav>
              </div>
            </section>

            <section class="Box"><div class="Box-h"><h3>Theo tuần</h3><span class="muted" id="weeksScope"></span></div><div class="Box-b" id="weeks"></div></section>

            <section class="Box"><div class="Box-h"><h3>Giờ làm</h3><span class="muted">nền xám là giờ hành chính</span></div><div class="Box-b scroll punch"><div id="offline" class="offline"></div><div id="punch"></div></div></section>

          </div>

          <div id="view-cay" class="view" hidden>
            <div class="lanes" id="lanes"></div>
            <div class="tree" id="tree"></div>
          </div>
        </div>
      </div>
      <aside class="detail" id="detail" aria-live="polite" aria-label="Chi tiết ngày"></aside>
      <div class="scrim" id="scrim" hidden></div>
      <div class="tooltip" id="tooltip" hidden></div>
      <div class="toast" id="toast" hidden role="status"></div>
    </div>
  </main>
  <script src="cong-no-format.js"></script>
  <script src="dashboard-v7-model.js"></script>
  <script src="viec-can-lam-table.js"></script>
  <script src="app-nav.js"></script>
  <script src="nhat-ky-cong-viec-ui.js"></script>
</body>
</html>
