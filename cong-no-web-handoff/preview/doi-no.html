<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Đòi nợ: khách quá hạn, đã nhắc lần cuối khi nào, nhắc ai chưa, soạn tin nhắc.">
  <title>Công nợ HTH · Đòi nợ</title>
  <link rel="stylesheet" href="cong-no-theme.css">
  <link rel="stylesheet" href="dashboard-v7.css">
  <link rel="stylesheet" href="doi-no.css">
<link rel="stylesheet" href="presence.css">
  <link rel="stylesheet" href="app-nav.css">
</head>
<body data-presence="doi-no">
  <div id="demo-banner" hidden role="status"></div>
  <aside class="app-nav" data-active="doi-no"></aside>
  <main class="page app-page">
    <div class="page-head topbar">
      <h1>Đòi nợ</h1>
      <time class="asof" id="as-of"></time><div class="live-controls"><time id="updated-at" aria-live="polite">Tự cập nhật mỗi 60 giây</time><button id="refresh-data" class="btn" type="button">Làm mới</button></div></div>
    <div id="error" role="alert" hidden></div>
    <div id="doi-no" aria-live="polite"><p class="loading">Đang tải số liệu…</p></div>
  </main>
  <div class="toast" id="toast" role="status" hidden></div>
  <dialog id="pending-ask" class="pending-ask" aria-labelledby="pending-title">
    <h2 id="pending-title">Khách còn phiếu thu chưa ghi</h2>
    <p id="pending-text"></p>
    <form method="dialog" class="actions"><button type="button" class="btn primary" id="pending-write">Ghi phiếu trước</button><button type="button" class="btn" id="pending-copy">Vẫn copy</button><button class="btn" value="cancel">Thôi</button></form>
  </dialog>
  <script src="cong-no-format.js"></script>
  <script src="dashboard-v7-model.js"></script>
  <script src="viec-can-lam-table.js"></script>
  <script src="app-nav.js"></script>
  <script src="doi-no.js"></script>
  <script src="presence.js"></script>
</body>
</html>
