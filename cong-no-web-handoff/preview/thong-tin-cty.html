<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Thông tin cty: thông tin xuất hóa đơn của khách và tài khoản nhận tiền, đọc từ Sheet thông tin khách hàng. Chỉ xem.">
  <title>Công nợ HTH · Thông tin cty</title>
  <link rel="stylesheet" href="cong-no-theme.css">
  <link rel="stylesheet" href="thong-tin-cty.css">
  <link rel="stylesheet" href="presence.css">
  <link rel="stylesheet" href="app-nav.css">
</head>
<body class="ttc" data-presence="thong-tin-cty">
  <div id="demo-banner" hidden role="status"></div>
  <aside class="app-nav" data-active="thong-tin-cty"></aside>
  <main class="page app-page">
    <div class="page-head topbar">
      <h1>Thông tin cty</h1>
      <div class="live-controls"><span class="asof" id="read-at">—</span><button id="refresh-data" class="btn icon-btn" type="button" aria-label="Làm mới số liệu" data-tip="Làm mới&#10;Lấy lại bản mới nhất từ máy chủ"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></button></div>
    </div>
    <div id="error" role="alert" hidden></div>
    <div class="ttc-main">
      <section class="ttc-customers" aria-labelledby="customers-title">
        <div class="ttc-head"><h2 id="customers-title">Khách hàng</h2>
          <label class="ttc-search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
            <input id="customer-filter" type="search" placeholder="Tìm tên shipper, tên công ty, MST" autocomplete="off" aria-label="Tìm khách"></label>
          <span class="ttc-count" id="customer-count" aria-live="polite"></span></div>
        <div id="customers"><p class="loading">Đang tải…</p></div>
      </section>
      <section class="ttc-accounts" aria-labelledby="accounts-title">
        <h2 id="accounts-title">Tài khoản nhận tiền</h2>
        <div id="accounts"></div>
      </section>
    </div>
    <p class="ttc-foot">Sửa trên Sheet thông tin khách hàng; web đọc lại mỗi giờ. Trang này chỉ xem.</p>
  </main>
  <div class="tip" id="tip" role="tooltip" hidden></div>
  <script src="cong-no-format.js"></script>
  <script src="dashboard-v7-model.js"></script>
  <script src="viec-can-lam-table.js"></script>
  <script src="app-nav.js"></script>
  <script src="data-tip.js"></script>
  <script src="thong-tin-cty-ui.js"></script>
  <script src="presence.js"></script>
</body>
</html>
