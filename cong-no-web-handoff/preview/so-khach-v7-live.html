<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sổ khách V7 · Sổ thử có API</title>
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#eef3f8;color:#162d48;font:14px/1.35 "Segoe UI",system-ui,sans-serif}
#app{padding:0 10px 24px}
.book-head{position:sticky;top:0;z-index:40;height:70px;display:flex;align-items:center;gap:24px;padding:8px 14px;background:#fff;border-bottom:2px solid #6584a5;box-shadow:0 2px 5px #162d4820}
#demo-banner:not([hidden]){position:sticky;top:0;z-index:60}
#customer-picker{padding:8px 14px;background:#fff;border-bottom:1px solid #9eb4ca}
#customer-picker label{font-weight:700}#customer-search{min-width:260px;min-height:32px;margin-left:8px;font:inherit}
#customer-list{max-height:240px;overflow-y:auto;margin-top:6px;max-width:min(600px,90vw)}
#customer-list:empty{display:none}
#customer-list a{display:block;min-height:40px;line-height:40px;padding:0 10px;color:#123;text-decoration:none;border-bottom:1px solid #dde6ef}
#customer-list a:hover,#customer-list a:focus{background:#eaf2fb;outline:2px solid #2d6cb5;outline-offset:-2px}
#customer-list a[aria-current=page]{font-weight:700}
body:has(#demo-banner:not([hidden])) .book-head{top:48px}
body:has(#demo-banner:not([hidden])) .ledger-head{top:118px}
body:has(#demo-banner:not([hidden])) .ledger .month th{top:186px}
.book-head h1{font-size:18px;margin:0;white-space:nowrap}.head-item{display:flex;flex-direction:column;min-width:0}.head-item span{color:#3e5871;font-size:13px}.head-item strong{font-size:16px}.head-item.total{margin-left:auto}.head-item.total strong{font-size:22px;color:#123f79}
.layout{display:flex;gap:12px;align-items:flex-start;max-width:1876px;margin:0 auto}
.ledger-book{width:1700px;flex:0 0 1700px}
.ledger-book section{scroll-margin-top:180px}
.ledger{width:100%;table-layout:fixed;border-spacing:0;border-collapse:separate;background:#fff;font-variant-numeric:tabular-nums}
.ledger-head{position:sticky;top:70px;z-index:30}
.ledger th,.ledger td{border-right:1px solid #d8e1ec;border-bottom:1px solid #d8e1ec;padding:4px 5px;vertical-align:middle;overflow-wrap:anywhere}
.ledger th{font-weight:700;text-align:left}.ledger td{min-height:38px;height:38px;font-size:13px}
.ledger .group th{height:30px;padding:3px 6px;background:#dbe8f7;color:#16385f;font-size:13px}
.ledger .group .group-pay{background:#cfe5ff;border-left:3px solid #3269a4}
.ledger .columns th{height:38px;padding:3px 5px;background:#eaf1fa;font-size:13px;line-height:1.12}
.ledger .columns .pay{background:#dfeeff}
.ledger .month th{position:sticky;top:138px;z-index:20;height:42px;padding:4px 10px;background:#24496e;color:#fff;font-size:15px;text-align:left}
.month-title{display:flex;align-items:center;gap:12px}.month-title em{margin-left:auto;font-style:normal;font-size:13px;font-weight:400}
.badge{padding:2px 8px;border-radius:10px;background:#eff4fc;color:#193d64;font-size:12px}.badge.open{background:#dbf5e4;color:#145b32}
.month-lock{min-width:32px;min-height:28px;border:1px solid #b6d3ed;border-radius:4px;background:#fff;cursor:pointer;font-size:16px}
.history-toggle,.history-close,.add-month-adjustment{min-height:28px;border:1px solid #8daac9;border-radius:4px;background:#fff;color:#173d65;cursor:pointer;font:inherit}
.history-toggle{white-space:nowrap}.add-month-adjustment{margin-left:8px;padding:2px 6px;font-weight:400}
.history-panel{position:fixed;z-index:50;right:12px;top:76px;bottom:12px;width:min(420px,calc(100vw - 24px));overflow:auto;padding:12px;background:#fff;border:1px solid #8daac9;box-shadow:0 8px 25px #162d4840}
.history-panel[hidden]{display:none}.history-panel header{display:flex;justify-content:space-between;align-items:center}.history-panel h2{margin:0;font-size:18px}
.history-panel ol{padding-left:22px}.history-panel li{padding:8px 0;border-bottom:1px solid #d8e1ec}.history-panel li time,.history-panel li span,.history-panel li strong{display:block}.history-panel li p{margin:4px 0}
.month-adjustment-input input{min-height:28px;max-width:100%;font:inherit}.month-adjustment-input .month-amount{width:100%;text-align:right}
.ledger td.num{text-align:right;white-space:nowrap;font-size:13px}
.ledger td.pay{background:#f2f8ff}.ledger td.pay-start,.ledger th.pay-start{border-left:3px solid #3269a4}
.ledger .missing{background:#ffddb0;color:#72410a;font-weight:700}
.ledger .editable{cursor:text;min-height:38px}.ledger .editable:hover,.ledger .editable:focus-visible{outline:2px solid #145fa9;outline-offset:-2px}
.money-input{width:100%;min-width:0;font:inherit;text-align:right}.cell-error,.paste-error{display:block;color:#a01616;font-weight:700;white-space:normal}
.receipt-date,.receipt-amount,.receipt-method{width:100%;min-height:28px;min-width:0;font:inherit;color:#162d48}.receipt-amount{text-align:right}.receipt-date::placeholder{color:#425b73}
.ledger .receipt:not(.voided):not(.voided-method){cursor:pointer}.ledger .receipt:focus-visible{outline:2px solid #145fa9;outline-offset:-2px}
.ledger .voided{text-decoration:line-through;color:#475d73}.ledger .voided-method{font-weight:700;color:#8b2020}
.void-prompt td,.void-trace td{background:#fff1e5;font-size:13px}.void-prompt input{min-height:28px;min-width:230px;font:inherit}.void-prompt button{min-height:28px;font:inherit;cursor:pointer}
.receipt-status td{background:#e2f5e8;color:#145b32;font-size:14px;font-weight:700;min-height:38px}
.adjustment td{background:#fff2f2}
.legacy td{background:#f6f7f9;color:#3a4652}.legacy td.source{font-size:13px;color:#6b4a00}
.legacy-caption td{background:#eef1f5;color:#3a4652;font-style:italic}
.source-total td{background:#eef1f5;color:#3a4652;font-weight:600;border-top:1px dashed #9eb4ca}.adjustment-note{min-width:250px;min-height:28px;font:inherit}
.paste-row td{background:#f2f8ff}.paste-input{display:block;width:100%;min-height:48px;font:inherit}
.ledger .subtotal td{height:44px;background:#e8f1fc;font-weight:700;border-top:2px solid #9bb8d5}
.ledger .subtotal td.pay{background:#e2efff}
.ledger .spacer td{height:16px;padding:0;background:#eef3f8;border:0}
.ledger-book section:last-child .spacer td{height:calc(100vh - 180px)}
.muted{color:#475d73}.empty-entry{display:block;min-height:28px}
.months-nav{position:sticky;top:148px;flex:0 0 150px;width:150px;background:#fff;border:1px solid #9eb4ca;border-radius:6px;padding:8px}
.months-nav h2{font-size:13px;margin:0 0 6px;color:#183c63}
.months-nav a{display:flex;min-height:32px;align-items:center;justify-content:space-between;gap:4px;color:#174b82;text-decoration:none;border-top:1px solid #e3eaf2;font-size:12px}
.months-nav a:hover,.months-nav a:focus-visible{background:#e4f0ff;text-decoration:underline}
.months-nav small{font-size:11px;color:#37536f;text-align:right}
a:focus-visible{outline:3px solid #145fa9;outline-offset:2px}
@media(max-width:1599px){
  .layout{max-width:1258px}.ledger-book{width:1258px;flex-basis:1258px}.months-nav,.source{display:none}
  .ledger col.col-0{width:38px!important}.ledger col.col-1{width:110px!important}.ledger col.col-2{width:78px!important}.ledger col.col-3{width:80px!important}.ledger col.col-4,.ledger col.col-5{width:86px!important}.ledger col.col-6{width:98px!important}.ledger col.col-7,.ledger col.col-9,.ledger col.col-10{width:90px!important}.ledger col.col-8{width:120px!important}.ledger col.col-11{width:128px!important}.ledger col.col-12{width:164px!important}.ledger col.col-13{display:none}
  .book-head{gap:12px;padding:6px 8px}.book-head h1{font-size:16px}.head-item strong{font-size:14px}.head-item.total strong{font-size:18px}
}
</style>
</head>
<body>
<p id="demo-banner" hidden role="status" style="margin:0;padding:12px;background:#ffe08a;color:#452600;text-align:center;font-weight:800;font-size:18px">Dữ liệu thử · DỮ LIỆU GIẢ · Không phải sổ thật</p>
<div id="customer-picker"><label for="customer-search">Tìm khách</label><input id="customer-search" type="search" autocomplete="off" aria-controls="customer-list" placeholder="Gõ tên khách"><span id="customer-count" role="status"></span><nav id="customer-list" aria-label="Danh sách khách tìm được"></nav></div>
<main id="app"></main>
<script src="so-khach-v7-model.js"></script>
<script src="so-khach-v7-api.js"></script>

<script src="so-khach-v7-ui.js"></script>
</body>
</html>
