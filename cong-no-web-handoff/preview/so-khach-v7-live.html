<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sổ khách V7 · Sổ thử có API</title>
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#eef3f8;color:#162d48;font:14px/1.35 "Segoe UI",system-ui,sans-serif}
#app{padding:0 10px 24px}
.book-head{position:sticky;top:0;z-index:40;height:70px;display:flex;align-items:center;gap:24px;padding:8px 14px;background:#fff;border-bottom:2px solid #6584a5;box-shadow:0 2px 5px #162d4820}
#demo-banner:not([hidden]){position:sticky;top:0;z-index:60}
#customer-picker{padding:8px 14px;background:#fff;border-bottom:1px solid #9eb4ca}
.dashboard-link{display:inline-flex;align-items:center;min-height:38px;margin-right:8px;color:#174b82;font-weight:700;white-space:nowrap}
#customer-picker label{font-weight:700}#customer-search{min-width:260px;min-height:32px;margin-left:8px;font:inherit}
#customer-list{max-height:240px;overflow-y:auto;margin-top:6px;max-width:min(600px,90vw)}
#customer-list:empty{display:none}
#customer-list a{display:block;min-height:40px;line-height:40px;padding:0 10px;color:#123;text-decoration:none;border-bottom:1px solid #dde6ef}
#customer-list a:hover,#customer-list a:focus{background:#eaf2fb;outline:2px solid #2d6cb5;outline-offset:-2px}
#customer-list a[aria-current=page]{font-weight:700}
#customer-list .customer-group{position:sticky;top:0;padding:4px 10px;background:#e3ecf5;color:#28496b;font-size:14px;font-weight:700;border-bottom:1px solid #b9cbdd}
body:has(#demo-banner:not([hidden])) .book-head{top:48px}
body:has(#demo-banner:not([hidden])) .ledger-head{top:118px}
body:has(#demo-banner:not([hidden])) .ledger .month th{top:156px}
.book-head h1{font-size:18px;margin:0;white-space:nowrap}.head-item{display:flex;flex-direction:column;min-width:0}.head-item span{color:#3e5871;font-size:13px}.head-item strong{font-size:16px}.head-item.total{margin-left:auto}.head-item.total strong{font-size:22px;color:#123f79}
.layout{display:flex;gap:12px;align-items:flex-start;max-width:1858px;margin:0 auto}
.ledger-book{width:1696px;flex:0 0 1696px}
.ledger-book section{scroll-margin-top:180px}
.ledger{width:100%;table-layout:fixed;border-spacing:0;border-collapse:separate;background:#fff;font-variant-numeric:tabular-nums}
.ledger-head{position:sticky;top:70px;z-index:30}
.ledger th,.ledger td{border-right:1px solid #d8e1ec;border-bottom:1px solid #d8e1ec;padding:4px 5px;vertical-align:middle;overflow-wrap:anywhere}
.ledger th{font-weight:700;text-align:left}.ledger td{min-height:38px;height:38px;font-size:13px}
.ledger .group th{height:30px;padding:3px 6px;background:#dbe8f7;color:#16385f;font-size:13px}
.ledger .group .group-pay{background:#cfe5ff;border-left:3px solid #3269a4}
.ledger .columns th{height:38px;padding:3px 5px;background:#eaf1fa;font-size:13px;line-height:1.12}
.ledger .columns .pay{background:#dfeeff}
.ledger .month th{position:sticky;top:108px;z-index:20;height:42px;padding:4px 10px;background:#24496e;color:#fff;font-size:15px;text-align:left}
.month-title{display:flex;align-items:center;gap:12px}.month-title em{margin-left:auto;font-style:normal;font-size:13px;font-weight:400}
.badge{padding:2px 8px;border-radius:10px;background:#eff4fc;color:#193d64;font-size:12px}.badge.open{background:#dbf5e4;color:#145b32}
.month-lock{min-width:32px;min-height:28px;border:1px solid #b6d3ed;border-radius:4px;background:#fff;cursor:pointer;font-size:16px}
.change-customer,.history-toggle,.history-close,.add-month-adjustment{min-height:28px;border:1px solid #8daac9;border-radius:4px;background:#fff;color:#173d65;cursor:pointer;font:inherit}
.change-customer,.history-toggle{white-space:nowrap}.add-month-adjustment{margin-left:8px;padding:2px 6px;font-weight:400}
.history-panel{position:fixed;z-index:50;right:12px;top:76px;bottom:12px;width:min(420px,calc(100vw - 24px));overflow:auto;padding:12px;background:#fff;border:1px solid #8daac9;box-shadow:0 8px 25px #162d4840}
.history-panel[hidden]{display:none}.history-panel header{display:flex;justify-content:space-between;align-items:center}.history-panel h2{margin:0;font-size:18px}
.history-panel ol{padding-left:22px}.history-panel li{padding:8px 0;border-bottom:1px solid #d8e1ec}.history-panel li time,.history-panel li span,.history-panel li strong{display:block}.history-panel li p{margin:4px 0}
.month-adjustment-input input{min-height:28px;max-width:100%;font:inherit}.month-adjustment-input .month-amount{width:100%;text-align:right}
.ledger td.num{text-align:right;white-space:nowrap;font-size:13px}
.ledger td.pay{background:#f2f8ff}.ledger td.pay-start,.ledger th.pay-start{border-left:3px solid #3269a4}
.ledger .missing{background:#ffddb0;color:#72410a;font-weight:700}
.ledger .editable{cursor:text;min-height:38px}.ledger .editable:hover,.ledger .editable:focus-visible{outline:2px solid #145fa9;outline-offset:-2px}
.money-input{width:100%;min-width:0;font:inherit;text-align:right}.cell-error,.paste-error{display:block;color:#a01616;font-weight:700;white-space:normal}
.receipt-date,.receipt-amount,.receipt-method{width:100%;min-height:28px;min-width:0;font:inherit;color:#162d48}.receipt-amount{text-align:right}.receipt-date::placeholder{color:#425b73}
.ledger .receipt:not(.voided):not(.voided-method){cursor:pointer}.ledger .receipt:focus-visible{outline:2px solid #145fa9;outline-offset:-2px}
.ledger .voided{text-decoration:line-through;color:#475d73}.ledger .voided-method{font-weight:700;color:#8b2020}
.void-prompt td,.void-trace td{background:#fff1e5;font-size:13px}.void-prompt input{min-height:28px;min-width:230px;font:inherit}.void-prompt button{min-height:28px;font:inherit;cursor:pointer}
.receipt-status td{background:#e2f5e8;color:#145b32;font-size:14px;font-weight:700;min-height:38px}
.adjustment td{background:#fff2f2}
.ledger .info-edit{cursor:text}.ledger .info-edit:hover,.ledger .info-edit:focus-visible{outline:2px solid #145fa9;outline-offset:-2px}
.info-input{width:100%;min-width:0;font:inherit}.ledger .row-delete{cursor:pointer}.ledger .row-delete:hover,.ledger .row-delete:focus-visible{outline:2px solid #a01616;outline-offset:-2px;color:#a01616}
.delete-prompt td{font-size:16px}.delete-prompt button{min-height:32px;font:inherit;cursor:pointer}.delete-prompt .confirm-delete{color:#fff;background:#a01616;border:1px solid #a01616;font-weight:700}
.adjustment-note{min-width:250px;min-height:28px;font:inherit}
.ledger .subtotal td{height:44px;background:#e8f1fc;font-weight:700;border-top:2px solid #9bb8d5}
.ledger .subtotal td.pay{background:#e2efff}
.ledger .spacer td{height:16px;padding:0;background:#eef3f8;border:0}
.ledger-book section:last-child .spacer td{height:calc(100vh - 180px)}
.receipt-ref{display:block;font-size:13px;line-height:1.3;font-weight:400;color:#425b73;text-align:right;cursor:pointer}.receipt-ref.voided{text-decoration:line-through}.receipt-reference{display:block;width:100%;min-width:0;min-height:26px;margin-top:2px;font:inherit;font-size:13px;color:#162d48}
.muted{color:#475d73}.empty-entry{display:block;min-height:28px}
.months-nav{position:sticky;top:148px;flex:0 0 150px;width:150px;background:#fff;border:1px solid #9eb4ca;border-radius:6px;padding:8px}
.months-nav h2{font-size:13px;margin:0 0 6px;color:#183c63}
.months-nav a{display:flex;min-height:32px;align-items:center;justify-content:space-between;gap:4px;color:#174b82;text-decoration:none;border-top:1px solid #e3eaf2;font-size:12px}
.months-nav a:hover,.months-nav a:focus-visible{background:#e4f0ff;text-decoration:underline}
.months-nav small{font-size:11px;color:#37536f;text-align:right}
a:focus-visible{outline:3px solid #145fa9;outline-offset:2px}
/* Góp ý 23/10/2026: một thanh đầu sổ, tháng khóa tô xám, chuyển tháng, bảng nhập kiểu Sheet (NHAP-SHEET-01) */
#customer-picker.in-head{position:relative;display:flex;align-items:center;gap:8px;padding:0;border:0;background:none}
#customer-picker.in-head label{font-size:16px;color:#3e5871}
#customer-picker.in-head #customer-search{width:280px;min-height:38px;margin:0;padding:4px 10px;border:1px solid #8daac9;border-radius:4px;font-size:16px;font-weight:700;color:#162d48}
#customer-picker.in-head #customer-count{display:none}
#customer-picker.in-head #customer-list{position:absolute;top:100%;left:0;z-index:70;width:420px;margin:0;background:#fff;border:1px solid #8daac9;box-shadow:0 8px 20px #162d4833}
.ledger.locked .month th{background:#5f7184}
.ledger.locked tr:is([data-row],.legacy) td:not(.pay):not(.missing){background:#eceff2}
.ledger.locked tr:is([data-row],.legacy) td.pay{background:#e6eaef}
.ledger tr.moved td:not(.pay){background:#fff3c4!important}
.ledger tr.sheet-new td:not(.pay){background:#fff1ad!important}
.ledger tr.sheet-conflict td:not(.pay){background:#ffd6d6!important}
.sheet-diff{margin-left:5px;border:0;background:transparent;color:#7f1616;text-decoration:underline;cursor:pointer;font:inherit}
.sheet-detail td{background:#fff0f0;color:#732020}
.sheet-detail td.sheet-value-conflict{vertical-align:top;font-weight:700}
.sheet-detail td small{display:block;margin-top:2px;color:#7f1616;font-size:11px;font-weight:400}
.sheet-choice-actions{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.sheet-choice-actions button{min-height:28px;padding:2px 7px;border:1px solid #b47c7c;border-radius:4px;background:#fff;color:#732020;font:inherit;font-size:12px;cursor:pointer}
.sheet-choice-actions button[data-sheet-decision="use_sheet"]{background:#732020;color:#fff}
.sheet-choice-actions button:disabled{opacity:.55;cursor:wait}
.sheet-approve{min-height:34px;padding:4px 10px;border:1px solid #8daac9;border-radius:4px;background:#fff;color:#173d65;font:inherit;font-weight:700;cursor:pointer}
.sheet-approve:disabled{opacity:.55;cursor:default}
.sheet-approve:focus-visible{outline:3px solid #145fa9;outline-offset:2px}
.moved-tag{color:#6b4a00;font-size:12px;font-weight:700}
.ghost td{height:32px;background:#f6f7f9;color:#475d73;font-style:italic}
.move-ask td{padding:8px 10px;background:#fff3c4;color:#452600;font-weight:700}
.ghost button,.move-ask button,.draft-bar button{min-height:30px;margin-left:8px;padding:0 12px;border:1px solid #8daac9;border-radius:4px;background:#fff;color:#173d65;font:inherit;font-style:normal;cursor:pointer}
.move-ask .move-yes,.draft-bar .draft-save{background:#145fa9;border-color:#145fa9;color:#fff;font-weight:700}
.draft-bar button:disabled{opacity:.45;cursor:not-allowed}
.draft-caption td{background:#e9f5ec;color:#1f5130;font-weight:700;border-top:2px solid #6aa57b}
.draft-row td{padding:0;background:#fff}.draft-row.draft td:not(.off){background:#fffbe8}.draft-row td.off{background:#eceff3}
.draft-row td.num,.draft-row td.muted{padding:4px 3px}.draft-row td.muted{font-size:11px;white-space:nowrap}.draft-row td small{display:block;font-size:11px}
.draft-input{display:block;width:100%;height:37px;border:0;padding:4px 5px;background:transparent;color:#162d48;font:inherit;outline:none}
.draft-row td:focus-within{outline:2px solid #145fa9;outline-offset:-2px}
.draft-row td.bad{box-shadow:inset 0 0 0 2px #c62828;background:#fff1f1}
.draft-row td.warn{background:#fff3c4}
.draft-bar td{height:auto;padding:6px 10px;background:#e9f5ec}.draft-bar div{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.draft-note{margin-left:8px;color:#6b4a00}
/* Cấn trừ hai sổ (CT-2SO) */
.offset-source-row td{height:auto;background:#eaf4ff}
.offset-source-cell{position:relative;overflow:visible;padding:6px 8px;font-size:16px}
.offset-caption{font-size:16px;font-weight:700;color:#315676;margin-bottom:3px}
.offset-source-select{width:100%;min-height:40px;padding:4px 26px 4px 8px;border:1px solid #98b1c7;border-radius:4px;background:#fff;color:#18466f;font:inherit;font-size:16px;text-align:left;cursor:pointer;position:relative}
.offset-source-select:after{content:'▾';position:absolute;right:8px;top:8px}
.offset-source-select:focus-visible,.offset-search:focus-visible,.offset-option:focus-visible{outline:3px solid #145fa9;outline-offset:1px}
.offset-source-error{font-size:16px}.offset-source-error:empty{display:none}
.offset-picker{position:absolute;z-index:45;top:calc(100% - 4px);right:0;width:min(520px,92vw);max-height:360px;overflow-y:auto;padding:8px;background:#fff;border:1px solid #7395b3;border-radius:4px;box-shadow:0 12px 24px #1b3c5d3b;text-align:left}
.offset-search{width:100%;min-height:40px;margin-bottom:6px;font:inherit;font-size:16px}
.offset-option{display:flex;width:100%;min-height:44px;align-items:center;justify-content:space-between;gap:12px;padding:6px 8px;border:0;border-bottom:1px solid #e1eaf2;background:#fff;color:#1e405e;font:inherit;font-size:16px;text-align:left;cursor:pointer}
.offset-option:hover{background:#e6f3ff}.offset-option strong{color:#8f3a28;white-space:nowrap;font-variant-numeric:tabular-nums}
.offset-outside{justify-content:flex-start;border-top:2px solid #9eb8d1;margin-top:6px;font-weight:700}
.offset-none{margin:0;padding:14px 8px;color:#475d73;font-size:16px;text-align:center}
.offset-link{display:block;font-size:14px;font-weight:700;color:#075fa2;text-decoration:underline;overflow-wrap:anywhere}
.offset-method{font-size:13px}
.offset-backdrop{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;background:#10243a88}
.offset-dialog{width:min(660px,94vw);max-height:92vh;overflow:auto;padding:20px 24px;background:#fff;border:1px solid #8cacc9;border-radius:8px;box-shadow:0 18px 60px #031d3655;font-size:16px}
.offset-dialog h2{margin:0 0 12px;font-size:20px;color:#173d66}
.offset-sentence{margin:0 0 14px;line-height:1.5}
.offset-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.offset-card{padding:12px;background:#f3f8fd;border:1px solid #d0dfea;border-radius:4px}
.offset-card-title{margin-bottom:8px;font-weight:700;color:#234d72;overflow-wrap:anywhere}
.offset-card-values{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:18px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.offset-card-values strong{color:#166345}
.offset-over{margin:0 0 10px;padding:10px 12px;background:#edf6fc;border:1px solid #bdd9ec;border-radius:4px;font-weight:700}
.offset-date-note{margin:0 0 10px;color:#3e5871}
.offset-dialog-error{margin:0 0 10px;font-size:16px}.offset-dialog-error:empty{display:none}
.offset-actions{display:flex;justify-content:flex-end;gap:10px}
.offset-actions button,.offset-void-prompt button{min-height:44px;padding:0 18px;border:1px solid #8daac9;border-radius:4px;background:#fff;color:#173d65;font:inherit;font-size:16px;cursor:pointer}
.offset-actions .offset-confirm,.offset-void-prompt .confirm-offset-void{background:#145fa9;border-color:#145fa9;color:#fff;font-weight:700}
.offset-actions button:disabled{opacity:.6;cursor:wait}
.review-open{min-height:34px;font:inherit;font-weight:700;color:#7a4b00;background:#fff3d6;border:2px solid #b87400;border-radius:4px;cursor:pointer}.review-prompt td{background:#fff3d6;font-size:16px}.review-prompt input{min-height:32px;min-width:300px;font:inherit}.review-prompt button{min-height:32px;font:inherit;cursor:pointer}.trip-rejected{text-decoration:line-through;color:#475d73;font-weight:700}
.offset-void-prompt td{font-size:16px}.offset-void-head{margin-bottom:8px;line-height:1.5}
.offset-void-prompt input{min-height:40px;min-width:280px;font:inherit;font-size:16px}
@media(max-width:1877px){
  .layout{max-width:1420px}.ledger-book{width:1258px;flex-basis:1258px}
  .ledger col.col-0{width:38px!important}.ledger col.col-1{width:100px!important}.ledger col.col-2{width:70px!important}.ledger col.col-3{width:70px!important}.ledger col.col-4,.ledger col.col-5,.ledger col.col-6{width:75px!important}.ledger col.col-7{width:85px!important}.ledger col.col-8,.ledger col.col-10,.ledger col.col-11{width:85px!important}.ledger col.col-9{width:110px!important}.ledger col.col-12{width:115px!important}.ledger col.col-13{width:120px!important}
  .book-head{gap:12px;padding:6px 8px}.book-head h1{font-size:16px}.head-item strong{font-size:14px}.head-item.total strong{font-size:18px}
}
@media(max-width:1439px){.layout{max-width:1258px}.months-nav{display:none}}
</style>
</head>
<body>
<p id="demo-banner" hidden role="status" style="margin:0;padding:12px;background:#ffe08a;color:#452600;text-align:center;font-weight:800;font-size:18px">Dữ liệu thử · DỮ LIỆU GIẢ · Không phải sổ thật</p>
<div id="customer-picker"><a class="dashboard-link" href="/dashboard-v7.html">← Tổng quan</a><label for="customer-search">Tìm khách</label><input id="customer-search" type="search" autocomplete="off" aria-controls="customer-list" placeholder="Gõ tên khách hoặc mặt hàng"><span id="customer-count" role="status"></span><nav id="customer-list" aria-label="Danh sách khách tìm được"></nav></div>
<main id="app"></main>
<script src="so-khach-v7-model.js"></script>
<script src="so-khach-v7-api.js"></script>

<script src="so-khach-v7-ui.js"></script>
</body>
</html>
