<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Người dùng: ai được vào sổ, ai là quản lý; cho vào login vừa bị chặn, thêm, đổi vai trò, bỏ quyền. Chỉ quản lý.">
  <title>Công nợ HTH · Người dùng</title>
  <link rel="stylesheet" href="cong-no-theme.css">
  <link rel="stylesheet" href="nguoi-dung.css">
  <link rel="stylesheet" href="presence.css">
  <link rel="stylesheet" href="app-nav.css">
</head>
<body class="nd" data-presence="nguoi-dung">
  <div id="demo-banner" hidden role="status"></div>
  <aside class="app-nav" data-active="nguoi-dung"></aside>
  <main class="page app-page">
    <div class="page-head topbar">
      <h1>Người dùng</h1>
      <div class="live-controls"><button id="refresh-data" class="btn icon-btn" type="button" aria-label="Đọc lại danh sách"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></button></div>
    </div>
    <div id="error" role="alert" hidden></div>
    <p id="flash" role="status" hidden></p>
    <div class="nd-main">
      <section id="denied-box" class="nd-denied" aria-labelledby="denied-title" hidden>
        <h2 id="denied-title">Vừa bị chặn</h2>
        <p class="nd-hint">Login đã thử mở sổ mà chưa có quyền, từ lần khởi động gần nhất của máy chủ.</p>
        <ul id="denied" class="nd-list"></ul>
      </section>
      <section aria-labelledby="users-title">
        <h2 id="users-title">Ai được vào sổ <span class="nd-count" id="user-count"></span></h2>
        <div id="users"><p class="loading">Đang tải…</p></div>
      </section>
      <section id="add-box" aria-labelledby="add-title" hidden>
        <h2 id="add-title">Thêm người</h2>
        <form id="add-form" class="nd-add" novalidate>
          <label>Login Tailscale<input id="add-login" type="text" inputmode="email" autocomplete="off" spellcheck="false" placeholder="ten@gmail.com" required></label>
          <label>Tên gọi<input id="add-name" type="text" autocomplete="off" maxlength="40" placeholder="Không bắt buộc"></label>
          <fieldset><legend>Vai trò</legend>
            <label class="nd-radio"><input type="radio" name="add-role" value="user" checked>Nhân viên</label>
            <label class="nd-radio"><input type="radio" name="add-role" value="admin">Quản lý</label>
          </fieldset>
          <button type="submit" class="btn primary" id="add-submit">Thêm</button>
        </form>
        <p class="nd-hint">Nhân viên thấy Tổng quan, Công nợ theo tháng, Sổ khách, Bảng thu, Báo cáo tháng. Quản lý thấy thêm mục Quản trị.</p>
      </section>
      <section aria-labelledby="history-title">
        <h2 id="history-title">Lịch sử</h2>
        <div id="history"></div>
      </section>
    </div>
  </main>
  <script src="cong-no-format.js"></script>
  <script src="dashboard-v7-model.js"></script>
  <script src="viec-can-lam-table.js"></script>
  <script src="app-nav.js"></script>
  <script src="nguoi-dung-ui.js"></script>
  <script src="presence.js"></script>
</body>
</html>
