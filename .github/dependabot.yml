# Nâng phụ thuộc hằng tuần (audit DevOps 31/10/2026, mục 11).
# Mỗi hệ gom mọi bản nâng vào một PR để ít PR; PR đi qua `ci-ok` như PR khác, merge là Deploy hao.
# Action ghim SHA kèm comment tag: Dependabot cập nhật cả hai.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 2
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 2
    groups:
      npm:
        applies-to: version-updates
        patterns: ["*"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  # requirements.txt khóa hash (tzdata), requirements-dev.txt chỉ ghim phiên bản (ruff).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 2
    groups:
      pip:
        applies-to: version-updates
        patterns: ["*"]
      pip-security:
        applies-to: security-updates
        patterns: ["*"]

  # Bot Zalo trên hao (audit vận hành 23/11/2026, O10): kênh zca-js (Node, bản cài riêng /opt/webdebit-zalo-kenh) và venv bộ não
  # (requirements.txt khóa hash). Kênh cầm phiên nick phụ: PR nâng chỉ là lời nhắc, cài lên hao vẫn theo runbook, đọc diff trước.
  - package-ecosystem: npm
    directory: /cong-no-web-handoff/tools/zalo_bot/kenh
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 2
    groups:
      zalo-kenh:
        applies-to: version-updates
        patterns: ["*"]
      zalo-kenh-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /cong-no-web-handoff/tools/zalo_bot
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 2
    groups:
      zalo-bot:
        applies-to: version-updates
        patterns: ["*"]
      zalo-bot-security:
        applies-to: security-updates
        patterns: ["*"]
