name: Deploy hao

# Deploy chỉ chạy sau Tests xanh trên đúng SHA của main. Hai đường (MERGE-QUEUE-01):
# - push vào main: deploy ngay nếu merge queue đã chạy Tests xanh trên chính SHA này (sự kiện merge_group);
#   commit hàng đợi đẩy lên main là commit đã kiểm, không chờ lượt Tests chạy lại thêm ~10 phút.
# - workflow_run: sau lượt Tests trên push main (đường cũ, và đường dự phòng khi đường push lỗi hoặc không qua hàng đợi).
# Hai đường cùng SHA không deploy hai lần (bước kiểm diff bỏ qua khi hao đã chạy SHA đó) và không deploy lùi
# (bỏ qua khi SHA là tổ tiên của bản đang chạy).
# GitHub-hosted runner vào tailnet bằng Tailscale; production `hao` chỉ nhận release qua forced-command SSH.
# Chỉ đổi release app. Migration/SQL/loader bị chặn ở bước kiểm diff và phải theo gate thủ công.
# Environment `hao` không có người duyệt (người dùng bỏ 28/10/2026, dự án một người làm); chỉ giữ luật nhánh main.
# Cài đặt: docs/hao-auto-deploy.md.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: SHA đầy đủ trên main cần triển khai lại
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-hao
  cancel-in-progress: false

jobs:
  # Đường push chỉ đi tiếp khi lượt Tests của merge queue trên đúng SHA này đã xanh. Job này không có secret.
  queue-checked:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      ok: ${{ steps.q.outputs.ok }}
    steps:
      - id: q
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          n=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&event=merge_group&status=success" \
                --jq '[.workflow_runs[] | select(.name == "Tests")] | length')
          echo "Lượt Tests merge_group xanh trên $SHA: $n"
          if [[ $n -gt 0 ]]; then echo "ok=1" >> "$GITHUB_OUTPUT"
          else echo "Không qua hàng đợi: chờ đường workflow_run sau lượt Tests trên main"; echo "ok=0" >> "$GITHUB_OUTPUT"; fi

  deploy:
    needs: queue-checked
    if: >-
      always() && (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && needs.queue-checked.outputs.ok == '1') ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: hao
    env:
      SHA: ${{ github.event.inputs.sha || github.event.workflow_run.head_sha || github.sha }}
      EVENT: ${{ github.event_name }}
      SSH_TARGET: ${{ secrets.HAO_SSH_USER }}@${{ vars.HAO_SSH_HOST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0

      - name: SHA phải nằm trên main
        run: |
          [[ $SHA =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$SHA" origin/main

      - uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.HAO_TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.HAO_TS_OAUTH_SECRET }}
          tags: tag:ci

      # Khóa lưu dạng base64 MỘT DÒNG (secret HAO_SSH_KEY_B64) để không hỏng vì xuống dòng/CRLF khi dán.
      - name: Chuẩn bị SSH
        env:
          KEY_B64: ${{ secrets.HAO_SSH_KEY_B64 }}
          KNOWN_HOSTS: ${{ vars.HAO_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s' "$KEY_B64" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          printf '\n' >> ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null || { echo "::error::HAO_SSH_KEY_B64 không phải private key hợp lệ"; exit 1; }
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Kiểm diff so với bản đang chạy
        id: diff
        run: |
          ssh_hao() { ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_TARGET" "$@"; }
          prev=$(ssh_hao current)
          echo "đang chạy: $prev"
          echo "prev=$prev" >> "$GITHUB_OUTPUT"
          [[ $prev == "$SHA" ]] && { echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; }
          [[ $prev =~ ^[0-9a-f]{40}$ ]] || { echo "hao chưa có release dạng SHA: cần chuyển thủ công lần đầu"; exit 1; }
          git cat-file -e "$prev^{commit}" || { echo "không thấy $prev trong lịch sử"; exit 1; }
          if [[ $EVENT != workflow_dispatch ]] && git merge-base --is-ancestor "$SHA" "$prev"; then
            echo "$SHA cũ hơn bản đang chạy, không deploy lùi"; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$prev" "$SHA")
          if grep -E '^specs/v7-backend/|^cong-no-web-handoff/tools/migrations/|\.sql$|^cong-no-web-handoff/tools/v7_load' <<< "$changed"; then
            echo "::error::Diff có migration/SQL/loader/deploy: cần gate thủ công, không tự động"; exit 1
          fi
          if ! grep -E '^cong-no-web-handoff/(web|preview|tools)/' <<< "$changed" >/dev/null; then
            echo "Không đổi mã app, bỏ qua"; echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Đẩy gói và chạy deploy trên hao
        id: deploy
        if: steps.diff.outputs.skip != '1'
        run: |
          # Chỉ file chạy thật (O9, audit vận hành 23/11/2026): danh sách cho phép ở scripts/deploy/release-paths.txt của chính SHA này.
          mapfile -t paths < <(grep -v -e '^#' -e '^$' scripts/deploy/release-paths.txt)
          [[ ${#paths[@]} -gt 0 ]] || { echo "::error::release-paths.txt rỗng"; exit 1; }
          git archive "$SHA" "${paths[@]}" \
            | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_TARGET" "deploy $SHA"

      # Nhật ký triển khai nằm ở đây và ở tab Environments → hao, không mở PR tài liệu chỉ để ghi "đã triển khai".
      - name: Tóm tắt triển khai
        if: always()
        env:
          PREV: ${{ steps.diff.outputs.prev }}
          SKIP: ${{ steps.diff.outputs.skip }}
          DIFF_OUTCOME: ${{ steps.diff.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          if [[ $DIFF_OUTCOME == failure ]]; then kq="DỪNG ở kiểm diff (gate SQL/migration hoặc thiếu mốc): triển khai tay theo runbook"
          elif [[ $SKIP == 1 ]]; then kq="BỎ QUA: không đổi mã app, đã chạy đúng SHA hoặc SHA cũ hơn bản đang chạy"
          elif [[ $DEPLOY_OUTCOME == success ]]; then kq="ĐÃ TRIỂN KHAI lên hao, kiểm sống đạt"
          else kq="LỖI khi triển khai ($DEPLOY_OUTCOME); script trên hao tự quay lại bản trước nếu kiểm sống lỗi"; fi
          {
            echo "## Deploy hao"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Kết quả | $kq |"
            echo "| Bản mới | \`$SHA\` |"
            echo "| Bản đang chạy trước đó | \`${PREV:-không rõ}\` |"
            if [[ $PREV =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$PREV^{commit}" 2>/dev/null; then
              echo
              echo "### Commit trong đợt"
              git log --format='- %s (`%h`)' "$PREV..$SHA"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
