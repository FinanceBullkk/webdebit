name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned timezone data
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt
      - name: Unit and HTTP fixture tests (no database)
        working-directory: cong-no-web-handoff
        run: python -m unittest discover -s tests -v

  postgres-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Characterize repository ledger schema on PostgreSQL 18.6
        run: python cong-no-web-handoff/tools/test_pg_ledger_schema.py --report pg-ledger-characterization.json
      - name: Upload PostgreSQL characterization report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg-ledger-characterization
          path: pg-ledger-characterization.json
          if-no-files-found: warn

  postgres-m1-history-queries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test HistoryDB M1 queries on isolated PostgreSQL 18.6
        run: python cong-no-web-handoff/tools/test_pg_m1_queries.py pg-m1-history-queries.json
      - name: Upload PostgreSQL M1 query report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg-m1-history-queries
          path: pg-m1-history-queries.json
          if-no-files-found: error

  pg18-versioned-approval-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test immutable approval revisions and opening resolution on PostgreSQL 18.6
        run: python cong-no-web-handoff/tools/test_pg_versioned_approval.py --report pg-versioned-approval.json
      - name: Upload versioned approval fixture report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg-versioned-approval-fixture
          path: pg-versioned-approval.json
          if-no-files-found: warn

  javascript:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned timezone data (viewer fixture server)
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Upload fake-data viewer screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewer-browser-screenshots-${{ matrix.os }}
          path: test-results/viewer
          if-no-files-found: warn
