name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Repo public từ 21/10/2026 nên chạy trên máy của GitHub (miễn phí, sạch mỗi lượt).
# Không dùng runner tự host: với repo public, PR từ fork sẽ chạy mã lạ trên máy đó,
# mà `hao` là máy của DB thật. Lượt cũ của cùng PR bị hủy khi có commit mới.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: requirements*.txt
      - name: Unit and HTTP fixture tests (no database)
        working-directory: cong-no-web-handoff
        run: >-
          uv run --python ${{ matrix.python }} --with-requirements ../requirements.txt
          python -m unittest discover -s tests -v

  postgres-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Characterize repository ledger schema on PostgreSQL 18.6
        run: uv run --python 3.13 python cong-no-web-handoff/tools/test_pg_ledger_schema.py --report pg-ledger-characterization.json
      - name: Verify F2/F3 migration from pre-fix schema on isolated PostgreSQL
        run: |
          git show 8c78c0f:cong-no-web-handoff/tools/pg_ledger_schema.sql > "$RUNNER_TEMP/pg-ledger-base.sql"
          uv run --python 3.13 python cong-no-web-handoff/tools/test_pg_ledger_schema.py --report pg-ledger-migration.json --base-schema "$RUNNER_TEMP/pg-ledger-base.sql" --migration cong-no-web-handoff/tools/migrations/2026-10-16-ledger-f2f3.sql
      - name: Upload PostgreSQL characterization report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg-ledger-characterization
          path: |
            pg-ledger-characterization.json
            pg-ledger-migration.json
          if-no-files-found: warn

  postgres-v7-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: V7 backend contract
        run: uv run --python 3.13 python cong-no-web-handoff/tools/test_pg_v7_backend.py
      - name: V7 P0 write paths
        run: uv run --python 3.13 python cong-no-web-handoff/tools/test_pg_v7_p0_harness.py --strict
      - name: V7 least privilege grants
        run: uv run --python 3.13 python cong-no-web-handoff/tools/test_pg_v7_grants.py --strict

  postgres-m1-history-queries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: astral-sh/setup-uv@v6
      - name: Test HistoryDB M1 queries on isolated PostgreSQL 18.6
        run: uv run --python 3.13 python cong-no-web-handoff/tools/test_pg_m1_queries.py pg-m1-history-queries.json
      - name: Upload PostgreSQL M1 query report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg-m1-history-queries
          path: pg-m1-history-queries.json
          if-no-files-found: error

  pg18-versioned-approval-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Test immutable approval revisions and opening resolution on PostgreSQL 18.6
        run: uv run --python 3.13 python cong-no-web-handoff/tools/test_pg_versioned_approval.py --report pg-versioned-approval.json
      - name: Upload versioned approval fixture report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg-versioned-approval-fixture
          path: pg-versioned-approval.json
          if-no-files-found: warn

  javascript:
    # CI gọi đúng `npm run check` như ở máy; nó đã gồm cả `test:viewer` nên ảnh
    # chụp viewer vẫn được sinh ra. Windows giữ lại vì người dùng chạy trên Windows.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: requirements*.txt
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      # Gọi thẳng `node scripts/check.js` (chính là `npm run check`): trên
      # windows-latest, `uv run` không spawn được `npm` vì đó là file npm.cmd.
      - name: ruff + luat nghiep vu + eslint + unittest + node --test + browser + viewer
        run: >-
          uv run --python 3.13 --with-requirements requirements.txt
          --with-requirements requirements-dev.txt node scripts/check.js
      - name: Upload fake-data viewer screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewer-browser-screenshots-${{ matrix.os }}
          path: test-results/viewer
          if-no-files-found: warn
