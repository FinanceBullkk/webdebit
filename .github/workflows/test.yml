name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Repo public từ 21/10/2026 nên chạy trên máy của GitHub (miễn phí, sạch mỗi lượt).
# Không dùng runner tự host: với repo public, PR từ fork sẽ chạy mã lạ trên máy đó,
# mà `hao` là máy của DB thật. Lượt cũ của cùng PR bị hủy khi có commit mới.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lọc theo file đổi bằng git diff (không dùng action ngoài). Push lên main và chạy tay luôn chạy đủ.
  # PR chỉ đổi tài liệu bỏ qua các job Postgres; ba job sổ cũ trước V7 chỉ chạy khi đổi file của chúng.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pg_v7: ${{ steps.f.outputs.pg_v7 }}
      pg_old: ${{ steps.f.outputs.pg_old }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: f
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "pg_v7=true" >> "$GITHUB_OUTPUT"; echo "pg_old=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git diff --name-only "$BASE...$HEAD" > changed.txt
          cat changed.txt
          if grep -qvE '\.md$|^docs/|^contexte/|^livrables/' changed.txt; then v7=true; else v7=false; fi
          if grep -qP '^(cong-no-web-handoff/tools/(pg_|migrations/|test_pg_(ledger|versioned|m1))|cong-no-web-handoff/web/(?!v7_)|cong-no-web-handoff/tests/test_m1_export_verify|\.github/workflows/test\.yml|requirements)' changed.txt; then old=true; else old=false; fi
          echo "pg_v7=$v7" >> "$GITHUB_OUTPUT"; echo "pg_old=$old" >> "$GITHUB_OUTPUT"

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: requirements*.txt
      - name: Unit and HTTP fixture tests (no database)
        working-directory: cong-no-web-handoff
        run: >-
          uv run --python ${{ matrix.python }} --with-requirements ../requirements.txt
          python -m unittest discover -s tests -v

  postgres-ledger:
    needs: changes
    if: needs.changes.outputs.pg_old == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Characterize repository ledger schema on PostgreSQL 18.6
        run: uv run --python 3.13 python cong-no-web-handoff/tools/test_pg_ledger_schema.py --report pg-ledger-characterization.json
      - name: Verify F2/F3 migration from pre-fix schema on isolated PostgreSQL
        run: |
          git show 8c78c0f:cong-no-web-handoff/tools/pg_ledger_schema.sql > "$RUNNER_TEMP/pg-ledger-base.sql"
          uv run --python 3.13 python cong-no-web-handoff/tools/test_pg_ledger_schema.py --report pg-ledger-migration.json --base-schema "$RUNNER_TEMP/pg-ledger-base.sql" --migration cong-no-web-handoff/tools/migrations/2026-10-16-ledger-f2f3.sql
      - name: Upload PostgreSQL characterization report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg-ledger-characterization
          path: |
            pg-ledger-characterization.json
            pg-ledger-migration.json
          if-no-files-found: warn

  postgres-v7-backend:
    needs: changes
    if: needs.changes.outputs.pg_v7 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: V7 backend contract
        run: uv run --python 3.13 python cong-no-web-handoff/tools/test_pg_v7_backend.py

  postgres-v7-p0:
    needs: changes
    if: needs.changes.outputs.pg_v7 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: V7 P0 write paths
        run: uv run --python 3.13 python cong-no-web-handoff/tools/test_pg_v7_p0_harness.py --strict

  postgres-v7-grants-direct:
    needs: changes
    if: needs.changes.outputs.pg_v7 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: V7 least privilege grants
        run: uv run --python 3.13 python cong-no-web-handoff/tools/test_pg_v7_grants.py --strict
      - name: V7 direct socket API and loader
        run: uv run --python 3.13 python cong-no-web-handoff/tools/test_pg_v7_direct.py --strict
      - name: V7 deployment rehearsal
        run: uv run --python 3.13 python cong-no-web-handoff/tools/rehearse_v7_deploy.py --strict

  postgres-m1-history-queries:
    needs: changes
    if: needs.changes.outputs.pg_old == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: astral-sh/setup-uv@v6
      - name: Test HistoryDB M1 queries on isolated PostgreSQL 18.6
        run: uv run --python 3.13 python cong-no-web-handoff/tools/test_pg_m1_queries.py pg-m1-history-queries.json
      - name: Upload PostgreSQL M1 query report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg-m1-history-queries
          path: pg-m1-history-queries.json
          if-no-files-found: error

  pg18-versioned-approval-fixture:
    needs: changes
    if: needs.changes.outputs.pg_old == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Test immutable approval revisions and opening resolution on PostgreSQL 18.6
        run: uv run --python 3.13 python cong-no-web-handoff/tools/test_pg_versioned_approval.py --report pg-versioned-approval.json
      - name: Upload versioned approval fixture report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg-versioned-approval-fixture
          path: pg-versioned-approval.json
          if-no-files-found: warn

  javascript:
    # CI gọi đúng `npm run check` như ở máy; nó đã gồm cả `test:viewer` nên ảnh
    # chụp viewer vẫn được sinh ra. Windows giữ lại vì người dùng chạy trên Windows.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: requirements*.txt
      - run: npm ci --ignore-scripts
      # Trình duyệt Playwright tải ~3 phút trên Windows (đo 22/10/2026); khóa cache theo phiên bản trong package-lock.
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        timeout-minutes: 10
        run: npx playwright install chromium
      # ubuntu-latest đã có sẵn thư viện Chromium cần; `--with-deps` chỉ tải thêm font và nâng
      # gói qua mirror apt, có lần treo quá 20 phút (run 39806153709, 22/10/2026). Nên chỉ gọi
      # apt khi Chromium không mở được: mỗi lượt tối đa 4 phút, thử lại một lần.
      - name: Playwright system deps (only if Chromium cannot launch)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          if node -e "require('playwright').chromium.launch().then(b => b.close())"; then
            echo "Chromium mở được, bỏ qua apt."; exit 0
          fi
          for i in 1 2; do
            timeout -k 30 240 npx playwright install-deps chromium && exit 0
            echo "::warning::playwright install-deps lượt $i lỗi hoặc quá 4 phút"
          done
          exit 1
      # Gọi thẳng `node scripts/check.js` (chính là `npm run check`): trên
      # windows-latest, `uv run` không spawn được `npm` vì đó là file npm.cmd.
      - name: ruff + luat nghiep vu + eslint + unittest + node --test + browser + viewer
        run: >-
          uv run --python 3.13 --with-requirements requirements.txt
          --with-requirements requirements-dev.txt node scripts/check.js
      - name: Upload fake-data viewer screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewer-browser-screenshots-${{ matrix.os }}
          path: test-results/viewer
          if-no-files-found: warn
