name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned timezone data
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt
      - name: Unit and HTTP fixture tests (no database)
        working-directory: cong-no-web-handoff
        run: python -m unittest discover -s tests -v

  postgres-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Characterize repository ledger schema on PostgreSQL 18.6
        run: python cong-no-web-handoff/tools/test_pg_ledger_schema.py --report pg-ledger-characterization.json
      - name: Upload PostgreSQL characterization report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg-ledger-characterization
          path: pg-ledger-characterization.json
          if-no-files-found: warn

  check:
    # Chạy đúng một lệnh mà người và agent chạy ở máy: `npm run check`.
    # Nếu CI gọi lệnh khác thì cái xanh ở máy không còn nói lên điều gì.
    name: check (lint + test)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned timezone data
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt
      - name: Install lint tooling
        run: python -m pip install -r requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: ruff + eslint + unittest + node --test + playwright
        run: npm run check
