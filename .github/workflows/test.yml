name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Ghim phiên bản uv (audit vận hành 23/11/2026, O10): không để mỗi lượt CI tự lấy bản mới nhất. Nâng tay khi cần.
env:
  UV_VERSION: 0.13.9

# CI chạy trên GitHub-hosted runners; production `hao` không chạy test.
# Linux/DB dùng ubuntu-latest; Windows compatibility dùng windows-latest.
# Vẫn giữ concurrency + path-filter như cũ.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lọc theo file đổi bằng git diff (không dùng action ngoài). Push lên main và chạy tay luôn chạy đủ.
  # PR chỉ đổi tài liệu bỏ qua các job Postgres; ba job sổ cũ trước V7 chỉ chạy khi đổi file của chúng.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pg_v7: ${{ steps.f.outputs.pg_v7 }}
      pg_old: ${{ steps.f.outputs.pg_old }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: f
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "pg_v7=true" >> "$GITHUB_OUTPUT"; echo "pg_old=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git diff --name-only "$BASE...$HEAD" > changed.txt
          cat changed.txt
          if grep -qvE '\.md$|^docs/|^contexte/|^livrables/' changed.txt; then v7=true; else v7=false; fi
          if grep -qP '^(cong-no-web-handoff/tools/(pg_|migrations/|test_pg_(ledger|versioned|m1))|cong-no-web-handoff/web/(?!v7_)|cong-no-web-handoff/tests/test_m1_export_verify|\.github/workflows/test\.yml|requirements)' changed.txt; then old=true; else old=false; fi
          echo "pg_v7=$v7" >> "$GITHUB_OUTPUT"; echo "pg_old=$old" >> "$GITHUB_OUTPUT"

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: requirements*.txt
      - name: Unit and HTTP fixture tests (no database)
        working-directory: cong-no-web-handoff
        run: >-
          uv run --python ${{ matrix.python }} --with-requirements ../requirements.txt
          python -m unittest discover -s tests -v

  postgres-ledger:
    needs: changes
    if: needs.changes.outputs.pg_old == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Characterize repository ledger schema on PostgreSQL 18.6
        run: uv run --python 3.14 python cong-no-web-handoff/tools/test_pg_ledger_schema.py --report pg-ledger-characterization.json
      - name: Verify F2/F3 migration from pre-fix schema on isolated PostgreSQL
        run: |
          git show 8c78c0f:cong-no-web-handoff/tools/pg_ledger_schema.sql > "$RUNNER_TEMP/pg-ledger-base.sql"
          uv run --python 3.14 python cong-no-web-handoff/tools/test_pg_ledger_schema.py --report pg-ledger-migration.json --base-schema "$RUNNER_TEMP/pg-ledger-base.sql" --migration cong-no-web-handoff/tools/migrations/2026-10-16-ledger-f2f3.sql
      - name: Upload PostgreSQL characterization report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pg-ledger-characterization
          path: |
            pg-ledger-characterization.json
            pg-ledger-migration.json
          if-no-files-found: warn

  postgres-v7-backend:
    needs: changes
    if: needs.changes.outputs.pg_v7 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: V7 backend contract and migration upgrade
        run: uv run --python 3.14 python cong-no-web-handoff/tools/test_pg_v7_backend.py --migration-test
      # File đọc định nghĩa hiện hành (cong-no-web-handoff/schema/v7_schema_current.pgsql) phải khớp SQL nguồn.
      # Lệch thì đỏ và in lệnh sinh lại. Chạy cả khi bước trên đỏ để thấy đủ hai kết quả.
      - name: V7 schema snapshot matches SQL sources
        if: success() || failure()
        run: uv run --python 3.14 python cong-no-web-handoff/tools/v7_schema_snapshot.py --check

  postgres-v7-p0:
    needs: changes
    if: needs.changes.outputs.pg_v7 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: V7 P0 write paths
        run: uv run --python 3.14 python cong-no-web-handoff/tools/test_pg_v7_p0_harness.py --strict

  postgres-v7-grants-direct:
    needs: changes
    if: needs.changes.outputs.pg_v7 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: V7 least privilege grants
        run: uv run --python 3.14 python cong-no-web-handoff/tools/test_pg_v7_grants.py --strict
      - name: V7 direct socket API and loader
        run: uv run --python 3.14 python cong-no-web-handoff/tools/test_pg_v7_direct.py --strict
      - name: V7 deployment rehearsal
        run: uv run --python 3.14 python cong-no-web-handoff/tools/rehearse_v7_deploy.py --strict
      # Sao lưu → khôi phục thật trên PostgreSQL 18 (audit vận hành 23/11/2026, O5). Biến môi trường làm thiếu Docker thành lỗi, không bỏ qua.
      - name: V7 backup and restore on isolated PostgreSQL
        env:
          WEBDEBIT_BACKUP_E2E_REQUIRED: '1'
        run: uv run --python 3.14 python cong-no-web-handoff/tools/test_v7_backup.py -v

  # Chuỗi lệnh ghi tiền ngẫu nhiên (Hypothesis, seed cố định) so với mô hình tham chiếu sau mỗi lệnh
  # (specs/v7-fifo-ngau-nhien.md). Hypothesis ghim ở requirements-dev.txt, chỉ dùng trong job này.
  postgres-v7-fifo:
    needs: changes
    if: needs.changes.outputs.pg_v7 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: requirements*.txt
      - name: V7 FIFO random command sequences vs reference model
        run: >-
          uv run --python 3.14 --with-requirements requirements-dev.txt
          python cong-no-web-handoff/tools/test_pg_v7_fifo_ngau_nhien.py

  # Bất biến tiền (specs/v7-bat-bien-tien.md): chuỗi lệnh ngẫu nhiên seed cố định trên ba sổ giả, kiểm số dư, FIFO,
  # hủy phiếu, khóa tháng, Lịch sử, cấn trừ, ngày tương lai sau mỗi lệnh. Chỉ thư viện chuẩn, không cần requirements-dev.
  postgres-v7-bat-bien:
    needs: changes
    if: needs.changes.outputs.pg_v7 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: V7 money invariants over seeded random command sequences
        run: uv run --python 3.14 python cong-no-web-handoff/tools/test_pg_v7_bat_bien.py

  # Lưới an toàn của máy canh (specs/v7-luoi-an-toan.md): sổ giả sạch không báo; mỗi phép kiểm có vi phạm cố ý làm nó đỏ.
  postgres-v7-luoi-an-toan:
    needs: changes
    if: needs.changes.outputs.pg_v7 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: V7 safety net checks on isolated PostgreSQL
        run: uv run --python 3.14 python cong-no-web-handoff/tools/test_pg_v7_luoi_an_toan.py

  # Đội xe đợt 1 (specs/chi-phi-xe-01.md): schema doixe trên PostgreSQL dùng một lần; lệnh ghi thật, quyền, chống ghi trùng,
  # số dư theo công thức đã chốt, khóa tháng, không ghi sokhach.
  postgres-doixe:
    needs: changes
    if: needs.changes.outputs.pg_v7 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Doi xe schema on isolated PostgreSQL
        run: uv run --python 3.14 python cong-no-web-handoff/tools/test_pg_doixe.py
      # Đội xe đợt 2 (specs/doi-xe-thu-01.md): bảng kê HTH, giá tuyến, tiền về, công nợ cước.
      - name: Doi xe bang ke (thu cuoc) on isolated PostgreSQL
        run: uv run --python 3.14 python cong-no-web-handoff/tools/test_pg_doixe_thu.py
      # Đội xe điều độ (specs/doi-xe-dieu-do-01.md): phân xe, luật nối việc ↔ chặng, đổi/bỏ phân công, nhận booking, mã nhà xe.
      - name: Doi xe dieu do on isolated PostgreSQL
        run: uv run --python 3.14 python cong-no-web-handoff/tools/test_pg_doixe_dieu_do.py
      # Đội xe mục Chặng (specs/doi-xe-chang-01.md): hàm đọc thu, chi, lãi gộp của chặng; tổng bằng get_so và get_bang_ke.
      - name: Doi xe chang tai chinh on isolated PostgreSQL
        run: uv run --python 3.14 python cong-no-web-handoff/tools/test_pg_doixe_chang.py
      # Audit Đội xe 23/11/2026: áp giá ngược phải xác nhận, số đang thấy ở ứng/hoàn/tiền về/điều chỉnh/xóa chặng/tên gốc, container lặp.
      - name: Doi xe sua audit on isolated PostgreSQL
        run: uv run --python 3.14 python cong-no-web-handoff/tools/test_pg_doixe_audit.py

  # Bản xuất cả sổ (specs/v7-xuat-ca-so.md): sổ giả qua lệnh ghi thật, xuất trong một giao dịch chỉ đọc, tự kiểm khớp;
  # hàm Tổng quan hay get_ledger bị làm sai thì tự kiểm đỏ.
  postgres-v7-xuat-so:
    needs: changes
    if: needs.changes.outputs.pg_v7 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: V7 whole-ledger export on isolated PostgreSQL
        run: uv run --python 3.14 python cong-no-web-handoff/tools/test_pg_v7_xuat_so.py

  postgres-m1-history-queries:
    needs: changes
    if: needs.changes.outputs.pg_old == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Test HistoryDB M1 queries on isolated PostgreSQL 18.6
        run: uv run --python 3.14 python cong-no-web-handoff/tools/test_pg_m1_queries.py pg-m1-history-queries.json
      - name: Upload PostgreSQL M1 query report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pg-m1-history-queries
          path: pg-m1-history-queries.json
          if-no-files-found: error

  pg18-versioned-approval-fixture:
    needs: changes
    if: needs.changes.outputs.pg_old == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Test immutable approval revisions and opening resolution on PostgreSQL 18.6
        run: uv run --python 3.14 python cong-no-web-handoff/tools/test_pg_versioned_approval.py --report pg-versioned-approval.json
      - name: Upload versioned approval fixture report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pg-versioned-approval-fixture
          path: pg-versioned-approval.json
          if-no-files-found: warn

  javascript:
    # CI gọi đúng `npm run check` như ở máy. Windows giữ lại vì người dùng chạy trên Windows.
    # Chỉ Python 3.14 (bản `hao` chạy): không test JS nào gọi Python, Python ở đây chỉ để cài ruff
    # và chạy unittest trên Windows. Trên ubuntu bỏ `test:py` vì job `python` đã chạy unittest
    # 3.12/3.13/3.14 trên ubuntu; Windows vẫn chạy để giữ phép kiểm unittest trên Windows.
    # Đặt tên tay để `include.skip` không chen vào tên check (vẫn là "javascript (<os>, <python>)").
    name: javascript (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.14']
        include:
          - os: ubuntu-latest
            skip: --skip=test:py
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: requirements*.txt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci --ignore-scripts
      # Trình duyệt Playwright tải ~3 phút trên Windows (đo 22/10/2026); khóa cache theo phiên bản trong package-lock.
      - name: Install Playwright Chromium
        timeout-minutes: 10
        run: npx playwright install chromium
      # ubuntu-latest đã có sẵn thư viện Chromium cần; `--with-deps` chỉ tải thêm font và nâng
      # gói qua mirror apt, có lần treo quá 20 phút (run 39806153709, 22/10/2026). Nên chỉ gọi
      # apt khi Chromium không mở được: mỗi lượt tối đa 4 phút, thử lại một lần.
      - name: Playwright system deps (only if Chromium cannot launch)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          if node -e "require('playwright').chromium.launch().then(b => b.close())"; then
            echo "Chromium mở được, bỏ qua apt."; exit 0
          fi
          for i in 1 2; do
            timeout -k 30 240 npx playwright install-deps chromium && exit 0
            echo "::warning::playwright install-deps lượt $i lỗi hoặc quá 4 phút"
          done
          exit 1
      # Gọi thẳng `node scripts/check.js` (chính là `npm run check`): trên
      # windows-latest, `uv run` không spawn được `npm` vì đó là file npm.cmd.
      - name: ruff + luat nghiep vu + eslint + unittest (chi Windows) + node --test + browser
        env:
          # Danh sách tên khách cho mẫu customer-name của check-secrets; `scripts/check.js` chỉ đưa cho
          # bước lint:sec. PR từ fork và Dependabot không nhận secret: mẫu đó in BỎ QUA (docs/development.md).
          WEBDEBIT_TEN_KHACH: ${{ secrets.WEBDEBIT_TEN_KHACH }}
        run: >-
          uv run --python ${{ matrix.python }} --with-requirements requirements.txt
          --with-requirements requirements-dev.txt node scripts/check.js ${{ matrix.skip }}

  # Required check duy nhất của main. Job bị path-filter bỏ qua (skipped) vẫn tính là qua;
  # chỉ failure/cancelled mới chặn. Thêm job mới thì thêm vào `needs`, không phải sửa luật nhánh.
  ci-ok:
    if: always()
    needs:
      - changes
      - python
      - postgres-ledger
      - postgres-v7-backend
      - postgres-v7-p0
      - postgres-v7-grants-direct
      - postgres-v7-fifo
      - postgres-v7-bat-bien
      - postgres-v7-luoi-an-toan
      - postgres-doixe
      - postgres-v7-xuat-so
      - postgres-m1-history-queries
      - pg18-versioned-approval-fixture
      - javascript
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mọi job phải success hoặc skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            [[ $r == success || $r == skipped ]] || { echo "::error::Có job $r"; exit 1; }
          done
